<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="LAN Viewer: stream files from your computer to phone and TV" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#1d3a73"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <path id="p1" d="M255,215 L450,215"/>
    <path id="p2" d="M450,215 L632,215"/>
    <path id="p3" d="M450,215 Q580,130 752,205"/>
  </defs>
  <style>
    text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .ring{fill:none;stroke:#8ab4ff;stroke-width:2;transform-origin:450px 215px;animation:pulse 3s ease-out infinite;opacity:0}
    .r2{animation-delay:1s}.r3{animation-delay:2s}
    @keyframes pulse{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.6);opacity:0}}
    .dash{fill:none;stroke:#8ab4ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .dev{fill:#0d0d10;stroke:#8ab4ff;stroke-width:2.5}
    .screen{fill:#1d3a73;animation:glow 3s ease-in-out infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}
    @keyframes glow{0%,100%{fill:#1d3a73}50%{fill:#3d6fd8}}
    .float{animation:bob 4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .hub{fill:#8ab4ff;animation:beat 1.5s ease-in-out infinite;transform-origin:450px 215px}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    .tag{fill:#9d9dac;font-size:14px;text-anchor:middle}
  </style>

  <rect width="900" height="300" rx="28" fill="url(#bg)"/>
  <g opacity=".18" fill="#8ab4ff">
    <circle cx="60" cy="50" r="2"/><circle cx="150" cy="30" r="1.5"/><circle cx="820" cy="40" r="2"/>
    <circle cx="860" cy="120" r="1.5"/><circle cx="30" cy="150" r="1.5"/><circle cx="700" cy="25" r="1.5"/>
  </g>

  <text x="450" y="78" text-anchor="middle" font-size="50" font-weight="700" fill="url(#ttl)" letter-spacing="-1">LAN Viewer</text>
  <text x="450" y="110" text-anchor="middle" font-size="17" fill="#c9d1e8">Your files. Every screen. No cloud.</text>

  <!-- connection waves -->
  <circle class="ring" cx="450" cy="215" r="20"/>
  <circle class="ring r2" cx="450" cy="215" r="20"/>
  <circle class="ring r3" cx="450" cy="215" r="20"/>

  <!-- links -->
  <path class="dash" d="M255,215 L450,215"/>
  <path class="dash" d="M450,215 L632,215"/>
  <path class="dash" d="M450,215 Q580,130 752,205"/>
  <circle r="5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="#fff"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#fff"><animateMotion dur="2.4s" begin=".4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle class="hub" cx="450" cy="215" r="10"/>

  <!-- computer -->
  <g class="float">
    <rect class="dev" x="120" y="175" width="120" height="76" rx="8"/>
    <rect class="screen" x="130" y="185" width="100" height="56" rx="4"/>
    <path d="M100,264 H260 L248,252 H112 Z" fill="#17171c" stroke="#8ab4ff" stroke-width="2"/>
    <path d="M150,205 h24 l6,8 h40 v22 h-70 z" fill="#8ab4ff" opacity=".9"/>
  </g>
  <text class="tag" x="180" y="290">Host</text>

  <!-- phone -->
  <g class="float" style="animation-delay:.6s">
    <rect class="dev" x="633" y="178" width="40" height="72" rx="8"/>
    <rect class="screen s2" x="639" y="188" width="28" height="48" rx="3"/>
  </g>
  <text class="tag" x="653" y="290">Phone</text>

  <!-- tv -->
  <g class="float" style="animation-delay:1.2s">
    <rect class="dev" x="752" y="180" width="104" height="64" rx="8"/>
    <rect class="screen s3" x="760" y="188" width="88" height="46" rx="4"/>
    <path d="M788,244 v10 M820,244 v10 M776,256 H832" stroke="#8ab4ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M796,200 l24,11 l-24,11 z" fill="#fff"/>
  </g>
  <text class="tag" x="804" y="290">Android TV</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
