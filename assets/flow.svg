<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Connection steps: share a folder, get a code, enter the code, browse and play" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-anchor:middle}
    .bg{fill:#0d0d10}
    .card{fill:#17171c;stroke:#34343e;stroke-width:2;animation:hl 8s ease-in-out infinite}
    .c2{animation-delay:2s}.c3{animation-delay:4s}.c4{animation-delay:6s}
    @keyframes hl{0%,22%,100%{stroke:#34343e;fill:#17171c}6%,16%{stroke:#8ab4ff;fill:#1d3a73}}
    .num{fill:#8ab4ff;font-size:13px;font-weight:700;letter-spacing:2px}
    .ico{font-size:34px}
    .h{fill:#ececf1;font-size:17px;font-weight:600}
    .d{fill:#9d9dac;font-size:13px}
    .ln{stroke:#8ab4ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 9;animation:mv 1s linear infinite;fill:none}
    @keyframes mv{to{stroke-dashoffset:-30}}
    .ar{fill:#8ab4ff}
    .code{animation:blink 2s steps(1) infinite}
    @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.35}}
  </style>
  <rect class="bg" width="900" height="230" rx="24"/>

  <g>
    <rect class="card" x="30" y="35" width="180" height="160" rx="20"/>
    <text class="num" x="120" y="64">STEP 1</text>
    <text class="ico" x="120" y="108">📂</text>
    <text class="h" x="120" y="140">Share a folder</text>
    <text class="d" x="120" y="162">Start LAN Host</text>
  </g>
  <g>
    <rect class="card c2" x="250" y="35" width="180" height="160" rx="20"/>
    <text class="num" x="340" y="64">STEP 2</text>
    <text class="ico code" x="340" y="108">🔢</text>
    <text class="h" x="340" y="140">Get your code</text>
    <text class="d" x="340" y="162">6 digits, e.g. 482 913</text>
  </g>
  <g>
    <rect class="card c3" x="470" y="35" width="180" height="160" rx="20"/>
    <text class="num" x="560" y="64">STEP 3</text>
    <text class="ico" x="560" y="108">📱</text>
    <text class="h" x="560" y="140">Enter the code</text>
    <text class="d" x="560" y="162">On phone, TV or PC</text>
  </g>
  <g>
    <rect class="card c4" x="690" y="35" width="180" height="160" rx="20"/>
    <text class="num" x="780" y="64">STEP 4</text>
    <text class="ico" x="780" y="108">🎬</text>
    <text class="h" x="780" y="140">Browse &amp; play</text>
    <text class="d" x="780" y="162">Videos, music, docs</text>
  </g>

  <path class="ln" d="M214,115 H236"/><path class="ar" d="M234,108 l12,7 l-12,7 z"/>
  <path class="ln" d="M434,115 H456"/><path class="ar" d="M454,108 l12,7 l-12,7 z"/>
  <path class="ln" d="M654,115 H676"/><path class="ar" d="M674,108 l12,7 l-12,7 z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
